# Serves the two built pages and forwards /api to the API container.
#   /      landing page          (dist/index.html)
#   /app/  Lunar Skyline tool    (dist/app/index.html)
#   /api/  FastAPI               (service "api" on the compose network)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API: terrain masks and the Horizons proxy. A live Horizons call can take a
    # while, so allow a long read timeout.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Vite fingerprints everything in /assets, so it can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Moon textures are large and only change when regenerated.
    location /moon/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Prebuilt Horizons and terrain data: cache briefly so a refresh picks up new files.
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # `/app` -> `/app/` so the tool's relative URLs and query strings behave.
    location = /app {
        return 301 /app/$is_args$args;
    }

    # Multi-page site: each folder has its own index.html. Never fall back to the
    # landing page for unknown paths.
    location / {
        try_files $uri $uri/ =404;
    }
}
