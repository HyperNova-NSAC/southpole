# Lunar Skyline: one image per part.
#
#   api  FastAPI + terrain pipeline (docker/api.Dockerfile)
#   web  nginx serving the built site, proxying /api to api (docker/web.Dockerfile)
#
# Before the first run, put the elevation file in ./dem (see README, "Elevation file"):
#   dem/LDEM_80S_80MPP_ADJ.TIF
# It is mounted read-only rather than baked into the image. Without it the app still
# works for the catalog sites, but typed coordinates report that terrain is unavailable.
#
# Run:   docker compose up --build -d
# Open:  http://localhost:8080        (set WEB_PORT to change it)
# Stop:  docker compose down
#
# Memory: the API reads the whole 7600x7600 elevation grid at start-up (about 230 MB as
# float32, plus a downsampled copy and the Python libraries), roughly 1 GB in total.
# Give the host at least 2 GB.

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: lunar-skyline-api
    restart: unless-stopped
    volumes:
      - ./dem:/app/dem:ro
      # Horizons responses are cached on disk; keep them across restarts.
      - api-cache:/app/server/cache
    # Not published: only the web container talks to the API.
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: lunar-skyline-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  api-cache:
